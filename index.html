<!DOCTYPE html>
<html lang="en" class="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HealthPlus Doctor Dashboard</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <!-- Lexend for Tailwind theme -->
    <link
      href="https://fonts.googleapis.com/css2?family=Lexend:wght@100..900&display=swap"
      rel="stylesheet"
    />
    <!-- Roboto for Material UI -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap"
    />
    <!-- Material Symbols for existing app -->
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
      rel="stylesheet"
    />
    <!-- Material Icons for MUI -->
    <link
      href="https://fonts.googleapis.com/icon?family=Material+Icons"
      rel="stylesheet"
    />
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              primary: "#07b9d5",
              "background-light": "#f8fbfc",
              "background-dark": "#0f2023",
              "surface-light": "#ffffff",
              "surface-dark": "#1a2c2f",
              "text-primary": "#0d1a1c",
              "text-secondary": "#48929d",
            },
            fontFamily: {
              display: ["Lexend", "sans-serif"],
              sans: ["Roboto", "sans-serif"], // Add Roboto for MUI compatibility
            },
            borderRadius: {
              DEFAULT: "0.5rem",
              lg: "0.75rem",
              xl: "1rem",
              full: "9999px",
            },
          },
        },
      };
    </script>
    <style>
      body {
        font-family: "Lexend", sans-serif;
      }
      .material-symbols-outlined {
        font-variation-settings: "FILL" 0, "wght" 400, "GRAD" 0, "opsz" 24;
      }
      .material-symbols-outlined.fill {
        font-variation-settings: "FILL" 1, "wght" 400, "GRAD" 0, "opsz" 24;
      }
      /* Custom scrollbar for cleaner look */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 3px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #94a3b8;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.2.0",
    "react/": "https://esm.sh/react@18.2.0/",
    "react-dom": "https://esm.sh/react-dom@18.2.0",
    "react-dom/": "https://esm.sh/react-dom@18.2.0/",
    "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
    "react-router-dom": "https://esm.sh/react-router-dom@6.22.3?external=react,react-dom",
    "@mui/material": "https://esm.sh/@mui/material@5.15.11?external=react,react-dom",
    "@mui/material/": "https://esm.sh/@mui/material@5.15.11/?external=react,react-dom",
    "@mui/material/utils": "https://esm.sh/@mui/material@5.15.11/utils?external=react,react-dom",
    "@mui/icons-material": "https://esm.sh/@mui/icons-material@5.15.11?external=react,react-dom,@mui/material",
    "@mui/icons-material/": "https://esm.sh/@mui/icons-material@5.15.11/?external=react,react-dom,@mui/material",
    "@emotion/react": "https://esm.sh/@emotion/react@11.11.3?external=react",
    "@emotion/styled": "https://esm.sh/@emotion/styled@11.11.0?external=react,@emotion/react",
    "@mui/system": "https://esm.sh/@mui/system@5.15.11?external=react,react-dom,@emotion/react,@emotion/styled",
    "@mui/styled-engine": "https://esm.sh/@mui/styled-engine@5.15.11?external=react,react-dom,@emotion/react,@emotion/styled",
    "mongoose": "https://aistudiocdn.com/mongoose@^9.0.0"

  }
}
</script>
</head>
  <body class="bg-background-light dark:bg-background-dark text-slate-900 dark:text-white">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
